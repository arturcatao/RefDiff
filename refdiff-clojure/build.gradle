plugins {
    id 'java-library'
    id 'eclipse'
}

repositories {
    maven { url 'https://repo.clojars.org/' }
}

dependencies {
    api project(':refdiff-core')
    implementation 'rewrite-clj:rewrite-clj:1.3.59'
    implementation 'org.clojure:clojure:1.11.4'
    implementation 'org.clojure:tools.reader:1.6.0'

    testImplementation 'junit:junit:4.11'
    testImplementation project(path: ':refdiff-core', configuration: 'testArtifacts')
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        refdiffClojure(MavenPublication) {
            artifactId = project.name
            from components.java
            pom pomConfig('Clojure plugin for RefDiff', 'Clojure language plugin for RefDiff')
        }
    }
}

signing {
    sign publishing.publications.refdiffClojure
}
